<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline'; img-src 'self' data:">
<title>AGOA TD</title>
<style>
:root { --red:#A31621; --teal:#2F6F72; --ink:#232323; --ink-soft:#5b5b5b; --line:#e3e0d8; }
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; overflow: hidden; }
body { background: #fff; color: var(--ink); font-family: "Segoe UI", system-ui, sans-serif; -webkit-user-select: none; user-select: none; -webkit-app-region: drag; }
.frame { position: fixed; inset: 0; border: 1px solid #cfcfcf; display: flex; flex-direction: column; align-items: center; justify-content: center; }
.logo { width: 112px; height: 112px; border-radius: 26px; display: block; margin-bottom: 40px; box-shadow: 0 1px 4px rgba(0,0,0,.12); }
h1 { margin: 0; font-size: 30px; font-weight: 800; letter-spacing: .5em; padding-left: .5em; white-space: nowrap; }
h1 span { color: var(--red); }
.sub { margin: 26px 0 0; font-size: 16px; color: var(--ink-soft); }
.status { margin: 44px 0 0; font-size: 14px; color: var(--ink-soft); min-height: 20px; }
.bar { width: 240px; height: 4px; border-radius: 2px; background: var(--line); margin-top: 10px; overflow: hidden; visibility: hidden; }
.bar.on { visibility: visible; }
.bar i { display: block; height: 100%; width: 0; background: var(--red); transition: width .25s ease; }
.bar.idle i { width: 40%; animation: slide 1.1s ease-in-out infinite; }
@keyframes slide { 0% { transform: translateX(-100%); } 100% { transform: translateX(260%); } }
.ver { position: absolute; right: 16px; bottom: 12px; font-size: 13px; color: #8a8a8a; }
@media (prefers-reduced-motion: reduce) { .bar.idle i { animation: none; width: 100%; opacity: .35; } }
</style>
</head>
<body>
<div class="frame" role="status" aria-live="polite">
  <img class="logo" src="../build/icon.png" alt="AGOA TD">
  <h1>AGOA <span>TD</span></h1>
  <p class="sub">Suivi des dossiers par personne</p>
  <p class="status" id="status">Démarrage…</p>
  <div class="bar" id="bar" aria-hidden="true"><i id="fill"></i></div>
  <span class="ver" id="ver"></span>
</div>
<script src="splash.js"></script>
</body>
</html>
