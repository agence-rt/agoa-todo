<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'unsafe-inline'; img-src 'self' data:">
<title>AGOA TD</title>
<style>
/* Charte AGOA (reprise de DTG Atelier) : bandeau rouge agence, boutons turquoise, fond papier, texte encre.
   Disposition : une colonne par personne, terminés en bas de colonne, colonne À FACTURER en dernier. */
:root {
  --red: #A31621;
  --red-dark: #7d1119;
  --teal: #2F6F72;
  --teal-dark: #234f52;
  --teal-ink: #234f52;
  --ink: #232323;
  --ink-soft: #5b5b5b;
  --paper: #FAF9F6;
  --card: #ffffff;
  --line: #e3e0d8;
  --soft: #f1f0eb;
  --arch: #ecebe6;
  --sep-bg: #fdf3c4;
  --hover: #f4f2ec;
  --tint-red: #fdeceb;
  --radius: 6px;
  --c-red: #C8372D;
  --c-orange: #C97A1E;
  --c-violet: #7A5BB5;
  --c-blue: #2F6FB0;
  --c-green: #3E7B4F;
  --c-teal: #2F6F72;
  --c-gray: #7B7B7B;
  --el-r: #C8372D;
  --el-g: #3E7B4F;
  --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --red: #8F1420; --red-dark: #6e0e17; --teal-ink: #86c9cc; --ink: #ECE9E2; --ink-soft: #A8A59D;
    --paper: #161616; --card: #1f1f1f; --line: #343434; --soft: #2a2a2a; --arch: #2b2b2a; --sep-bg: #4a4220; --hover: #262626; --tint-red: #3a1d20;
    --c-red: #F0746B; --c-orange: #E5A04A; --c-violet: #A58BE0; --c-blue: #6FA6E3; --c-green: #6FBF86; --c-teal: #5FB0B4; --c-gray: #9A9A9A;
    --el-r: #F0746B; --el-g: #6FBF86;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --red: #8F1420; --red-dark: #6e0e17; --teal-ink: #86c9cc; --ink: #ECE9E2; --ink-soft: #A8A59D;
  --paper: #161616; --card: #1f1f1f; --line: #343434; --soft: #2a2a2a; --hover: #262626; --tint-red: #3a1d20;
  --c-red: #F0746B; --c-orange: #E5A04A; --c-violet: #A58BE0; --c-blue: #6FA6E3; --c-green: #6FBF86; --c-teal: #5FB0B4; --c-gray: #9A9A9A;
  --el-r: #F0746B; --el-g: #6FBF86;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { margin: 0; background: var(--paper); color: var(--ink); font-family: var(--font); font-size: 14px; line-height: 1.4; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--teal); outline-offset: 2px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* Bandeau */
#topbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 10; display: flex; align-items: center; justify-content: space-between; gap: 12px 24px; flex-wrap: wrap; background: var(--red); color: #fff; padding: 8px 16px; }
.tb-left, .tb-right { display: flex; align-items: center; gap: 12px; min-width: 0; }
.badge { width: 38px; height: 38px; border-radius: 6px; background: #fff; color: var(--red); display: grid; place-items: center; font-weight: 800; font-size: 17px; letter-spacing: .02em; flex: none; }
.brand { font-weight: 700; font-size: 17px; letter-spacing: .02em; line-height: 1.1; }
.brand-accent { font-weight: 400; opacity: .85; }
.tb-sub { font-size: 12px; opacity: .8; }
.week { display: flex; align-items: baseline; gap: 8px; }
.week small { font-size: 12px; text-transform: uppercase; letter-spacing: .08em; opacity: .85; }
.week b { font-size: 34px; font-weight: 800; line-height: 1; font-variant-numeric: tabular-nums; }
.today { font-size: 18px; font-weight: 600; text-transform: capitalize; }
.tb-sep { width: 1px; align-self: stretch; background: rgba(255,255,255,.35); }
@media (max-width: 720px) { .tb-sep { display: none; } .today { font-size: 15px; } .week b { font-size: 28px; } }

/* Boutons */
.btn { border: 1px solid transparent; border-radius: var(--radius); padding: 6px 12px; font-size: 13px; transition: background .12s, border-color .12s; }
.btn.small { padding: 4px 9px; font-size: 12px; }
.btn-ghost { background: rgba(255,255,255,.12); color: #fff; border-color: rgba(255,255,255,.35); }
.btn-ghost:hover { background: rgba(255,255,255,.24); }
.btn-outline { background: var(--card); color: var(--teal-ink); border-color: var(--teal); }
.btn-outline:hover { background: var(--hover); }
.btn-primary { background: var(--teal); color: #fff; }
.btn-primary:hover { background: var(--teal-dark); }
.btn-primary:disabled { opacity: .45; cursor: not-allowed; }
.btn-plain { background: var(--soft); color: var(--ink); border-color: var(--line); }
.btn-plain:hover { background: var(--hover); }
.btn-danger { background: var(--card); color: var(--red); border-color: color-mix(in srgb, var(--red) 40%, var(--line)); }
.btn-danger.armed { background: var(--red); color: #fff; border-color: var(--red); }

.wrap { padding: 14px 16px 56px; display: flex; flex-direction: column; gap: 12px; min-width: 0; }

/* Barre d'outils */
.toolbar { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; }
.search input { width: 260px; max-width: 100%; padding: 7px 10px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--card); }
.legend { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { display: inline-flex; align-items: center; gap: 7px; padding: 4px 10px 4px 8px; border: 1px solid var(--line); border-radius: 999px; background: var(--card); font-size: 13px; }
.chip .sw { width: 10px; height: 10px; border-radius: 2px; background: var(--c, var(--line)); flex: none; }
.chip i { font-style: normal; font-size: 11.5px; color: var(--ink-soft); font-variant-numeric: tabular-nums; }
.chip[aria-pressed="true"] { background: color-mix(in srgb, var(--c) 20%, var(--card)); border-color: var(--c); }
.chip.clear { border-style: dashed; color: var(--ink-soft); }
.typeform { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 8px 10px; }
.typeform input[type="text"] { padding: 6px 9px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--paper); width: 200px; max-width: 100%; }
.swatches { display: flex; gap: 5px; }
.swatches button { width: 22px; height: 22px; border-radius: 50%; border: 2px solid transparent; background: var(--c); padding: 0; }
.swatches button[aria-pressed="true"] { border-color: var(--ink); box-shadow: 0 0 0 2px var(--card) inset; }

/* Onglets */
.tabs { display: flex; gap: 2px; overflow-x: auto; border-bottom: 1px solid var(--line); scrollbar-width: thin; align-items: flex-end; }
.tabs button { flex: none; border: 0; background: none; padding: 8px 12px; font-size: 13px; color: var(--ink); border-radius: var(--radius) var(--radius) 0 0; }
.tabs button i { font-style: normal; font-size: 11px; color: var(--ink-soft); margin-left: 6px; }
.tabs button:hover { background: var(--hover); }
.tabs button[aria-pressed="true"] { background: var(--tint-red); color: var(--red); font-weight: 600; box-shadow: inset 0 -2px 0 var(--red); }
.tabs button.add { color: var(--teal-ink); }
.tabs form { display: flex; gap: 6px; padding: 4px 6px; }
.tabs form input { padding: 4px 8px; border: 1px solid var(--teal); border-radius: var(--radius); background: var(--card); width: 150px; }

/* Tableau */
.board { display: flex; gap: 8px; overflow-x: auto; align-items: flex-start; padding-bottom: 12px; scroll-snap-type: x proximity; }
.col { flex: 0 0 min(88vw, 232px); scroll-snap-align: start; background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 8px 8px 10px; display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.board.solo { overflow: visible; }
.board.solo .col { flex: 1 1 auto; max-width: 780px; }
.col.dropcol { outline: 2px dashed var(--teal); outline-offset: -2px; }
.col.bill { border-color: var(--teal); background: color-mix(in srgb, var(--teal) 5%, var(--card)); }
.col-h .row { display: flex; align-items: center; gap: 8px; }
.col-h h2 { margin: 0; flex: 1; min-width: 0; font-size: 14.5px; font-weight: 700; letter-spacing: .03em; text-transform: uppercase; overflow-wrap: anywhere; }
.col-h .n { font-size: 12px; color: var(--ink-soft); white-space: nowrap; font-variant-numeric: tabular-nums; }
.col-h .more { width: 28px; height: 28px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--card); line-height: 1; }
.col-h .more[aria-expanded="true"] { background: var(--soft); }
.bar { display: flex; height: 4px; gap: 2px; margin-top: 7px; }
.bar span { background: var(--c, var(--line)); border-radius: 2px; min-width: 3px; }
.colmenu { margin-top: 8px; padding: 8px; background: var(--soft); border-radius: var(--radius); display: flex; flex-direction: column; gap: 8px; }
.colmenu form { display: flex; gap: 6px; }
.colmenu input { flex: 1; min-width: 0; padding: 5px 8px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--card); }
.colmenu .rowb { display: flex; flex-wrap: wrap; gap: 6px; }

.list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 4px; min-height: 10px; }
.empty { color: var(--ink-soft); font-size: 12.5px; padding: 2px; }

.task { --c: transparent; position: relative; display: grid; grid-template-columns: 32px minmax(0, 1fr); align-items: start; background: var(--card); border: 1px solid var(--line); border-left: 4px solid transparent; border-radius: 4px; }
.task.typed { background: var(--tint); border-color: color-mix(in srgb, var(--c) 35%, var(--line)); border-left-color: transparent; }
.stripe { position: absolute; left: -1px; top: -1px; bottom: -1px; width: 5px; background: var(--stripe); border-radius: 4px 0 0 4px; pointer-events: none; }
.chk { margin: 8px 0 0 8px; width: 18px; height: 18px; border: 1.5px solid var(--ink-soft); border-radius: 4px; background: var(--card); padding: 0; display: grid; place-items: center; color: #fff; }
.chk svg { width: 12px; height: 12px; opacity: 0; }
.chk:hover { border-color: var(--teal); }
.chk[aria-checked="true"] { background: var(--c-gray); border-color: var(--c-gray); }
.chk[aria-checked="true"] svg { opacity: 1; }
.tbody { min-width: 0; }
.open { text-align: left; background: none; border: 0; padding: 7px 8px 7px 4px; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.line1 { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 6px; min-width: 0; }
.ref { font-weight: 600; font-size: 12.5px; overflow-wrap: anywhere; }
.note { font-size: 12px; color: var(--ink-soft); overflow-wrap: anywhere; }
.task.b .ref { font-weight: 800; }
.task.u .ref { text-decoration: underline; text-underline-offset: 3px; text-decoration-thickness: 1px; }
.task.i .ref, .task.i .note { font-style: italic; }
.pills { display: contents; }
.pill { display: inline-flex; align-items: center; gap: 4px; border: 1px solid var(--p); background: color-mix(in srgb, var(--p) 16%, var(--card)); border-radius: 999px; padding: 0 7px; font-size: 11px; font-weight: 600; line-height: 18px; --p: var(--el-r); }
.pill.g { --p: var(--el-g); }
.pill .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--p); }
.pill:hover { background: color-mix(in srgb, var(--p) 28%, var(--card)); }
.tag { display: inline-block; font-size: 11px; border-radius: 3px; padding: 0 5px; line-height: 17px; background: var(--soft); color: var(--ink-soft); border: 1px solid var(--line); }
.tag.bill { background: color-mix(in srgb, var(--teal) 14%, var(--card)); color: var(--teal-ink); border-color: var(--teal); }
.task.done { --c: var(--c-gray); background: var(--soft); color: var(--ink-soft); border-color: var(--line); border-left-color: var(--line); }
.task.done .ref { font-weight: 500; color: var(--ink-soft); }
.task.dragging { opacity: .35; }
.task.before::before, .task.after::after, .sep.before::before, .sep.after::after { content: ""; position: absolute; left: 0; right: 0; height: 2px; background: var(--teal); }
.task.before::before, .sep.before::before { top: -3px; }
.task.after::after, .sep.after::after { bottom: -3px; }

.sep { position: relative; display: flex; align-items: center; justify-content: center; margin: 6px 0 2px; padding: 5px 26px; background: var(--sep-bg); border-radius: 3px; }
.sep .lbl { background: none; border: 0; padding: 0; font-size: 11.5px; font-weight: 700; text-transform: uppercase; letter-spacing: .07em; color: var(--ink); text-align: center; }
.sep .rule { display: none; }
.sep.fixed { margin: 8px 0 4px; }
.archcats { flex-wrap: wrap; margin-top: 6px; }
.sep .x { position: absolute; right: 4px; top: 50%; transform: translateY(-50%); border: 0; background: none; color: var(--ink-soft); font-size: 15px; line-height: 1; padding: 0 3px; opacity: .5; }
.sep:hover .x { opacity: 1; }
.sep input { flex: 1; text-align: center; padding: 3px 7px; border: 1px solid var(--teal); border-radius: var(--radius); background: var(--card); font-size: 12.5px; }

.acts { display: flex; gap: 6px; flex-wrap: wrap; }
.addbtn { flex: 1; text-align: left; background: none; border: 1px dashed var(--line); border-radius: 4px; padding: 6px 8px; color: var(--ink-soft); font-size: 13px; }
.addbtn:hover { border-color: var(--teal); color: var(--teal-ink); }
.addbtn.small { flex: 0 0 auto; }
.addwrap { display: flex; flex-direction: column; gap: 4px; }
.addrow { display: flex; gap: 4px; }
.addrow input, .sepform input { flex: 1; min-width: 0; padding: 6px 8px; border: 1px solid var(--teal); border-radius: 4px; background: var(--card); }
.addrow button, .sepform button { padding: 5px 9px; border: 0; border-radius: 4px; background: var(--teal); color: #fff; font-size: 13px; }
.sepform { display: flex; gap: 4px; }
.sug { list-style: none; margin: 0; padding: 0; border: 1px solid var(--line); border-radius: 4px; background: var(--card); overflow: hidden; }
.sug:empty { display: none; }
.sug li + li { border-top: 1px solid var(--line); }
.sug-it, .sug-manual { display: flex; flex-direction: column; gap: 1px; width: 100%; text-align: left; background: none; border: 0; padding: 6px 8px; }
.sug-it:hover, .sug-it.on, .sug-manual:hover { background: var(--hover); }
.sug-it .c { font-weight: 700; font-size: 13px; }
.sug-it .o { font-size: 12px; color: var(--ink-soft); overflow-wrap: anywhere; }
.sug-msg { padding: 6px 8px; font-size: 12.5px; color: var(--ink-soft); }
.sug-manual { color: var(--teal-ink); font-size: 12.5px; font-weight: 600; }
.sug-manual.alt { font-weight: 400; color: var(--ink-soft); }

.hist { margin: 22px -8px -10px; padding: 10px 8px 12px; background: var(--arch); border-top: 1px solid var(--line); border-radius: 0 0 var(--radius) var(--radius); display: flex; flex-direction: column; gap: 6px; }
.hist .task.done { background: var(--card); }
.hist.closed { padding-top: 8px; padding-bottom: 8px; }
.hist-t { display: flex; align-items: center; gap: 8px; width: 100%; margin: 0; padding: 2px 0; background: none; border: 0; text-align: left; font-size: 11.5px; text-transform: uppercase; letter-spacing: .07em; color: var(--ink-soft); font-weight: 700; }
.hist-t i { font-style: normal; font-weight: 400; text-transform: none; letter-spacing: 0; margin-left: auto; font-variant-numeric: tabular-nums; }
.hist-t .chev { transition: transform .15s; }
.hist-t[aria-expanded="true"] .chev { transform: rotate(90deg); }
.hist h3 { margin: 0; font-size: 11.5px; text-transform: uppercase; letter-spacing: .07em; color: var(--ink-soft); }
.wk { font-size: 11.5px; color: var(--ink-soft); display: flex; align-items: center; gap: 8px; margin-top: 2px; }
.wk::after { content: ""; flex: 1; height: 1px; background: var(--line); }

.sendbox { display: flex; flex-direction: column; gap: 6px; }
.sendbox .hint { font-size: 12px; color: var(--ink-soft); }
.billrow { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: start; background: var(--card); border: 1px solid var(--line); border-left: 4px solid var(--teal); border-radius: 4px; }
.billrow .mini { border: 0; background: none; font-size: 17px; line-height: 1; padding: 6px 9px; color: var(--ink-soft); }
.billrow .mini:hover { color: var(--red); }
.lblock { border: 1px solid var(--line); border-radius: 4px; background: var(--card); }
.lhead { width: 100%; display: flex; align-items: center; gap: 8px; text-align: left; background: none; border: 0; padding: 7px 9px; font-size: 13px; }
.lhead b { font-weight: 700; }
.lhead i { font-style: normal; font-size: 12px; color: var(--ink-soft); margin-left: auto; }
.lhead .chev { transition: transform .15s; color: var(--ink-soft); }
.lhead[aria-expanded="true"] .chev { transform: rotate(180deg); }
.litems { list-style: none; margin: 0; padding: 4px 9px 9px; display: flex; flex-direction: column; gap: 5px; border-top: 1px solid var(--line); }
.litems li { font-size: 12.5px; }
.litems .m { color: var(--ink-soft); }
.msg { padding: 24px 4px; color: var(--ink-soft); }

.foot { color: var(--ink-soft); font-size: 12.5px; display: flex; flex-wrap: wrap; gap: 6px 18px; border-top: 1px solid var(--line); padding-top: 10px; }

/* Menu d'archivage */
#menu { position: fixed; z-index: 40; background: var(--card); border: 1px solid var(--ink-soft); border-radius: var(--radius); box-shadow: 0 6px 20px rgba(0,0,0,.2); padding: 6px; display: flex; flex-direction: column; gap: 4px; min-width: 230px; }
#menu .t { font-size: 11.5px; color: var(--ink-soft); padding: 2px 6px 4px; overflow-wrap: anywhere; }
#menu button { text-align: left; padding: 8px 10px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--card); }
#menu button:hover { background: var(--hover); }
#menu .b { border-color: var(--teal); color: var(--teal-ink); font-weight: 600; }
#menu .dng { border-color: color-mix(in srgb, var(--red) 40%, var(--line)); color: var(--red); font-weight: 600; }
#dlgscrim { position: fixed; inset: 0; background: rgba(0,0,0,.45); z-index: 50; }
#dlg { position: fixed; z-index: 51; left: 50%; top: 50%; transform: translate(-50%,-50%); width: min(420px, calc(100% - 32px)); background: var(--card); color: var(--ink); border: 1px solid var(--line); border-top: 4px solid var(--red); border-radius: var(--radius); box-shadow: 0 10px 30px rgba(0,0,0,.3); padding: 18px; }
#dlg h2 { margin: 0 0 6px; font-size: 16px; }
#dlg p { margin: 0 0 14px; color: var(--ink-soft); overflow-wrap: anywhere; }
#dlg .rowb { display: flex; justify-content: flex-end; gap: 8px; }
#dlg .btn-red { background: var(--red); color: #fff; border-color: var(--red); }
.sw.bold { background: none !important; width: auto !important; height: auto !important; font-weight: 800; font-size: 12px; line-height: 1; color: var(--ink); }

/* Tiroirs */
#scrim { position: fixed; inset: 0; background: rgba(0,0,0,.4); z-index: 20; }
.sheet { position: fixed; top: 0; right: 0; bottom: 0; width: min(440px, 100%); z-index: 30; background: var(--paper); border-left: 1px solid var(--line); overflow-y: auto; padding: calc(14px + env(safe-area-inset-top, 0px)) 18px calc(20px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 14px; animation: slide .16s ease-out; }
@keyframes slide { from { transform: translateX(20px); opacity: 0; } to { transform: none; opacity: 1; } }
@media (prefers-reduced-motion: reduce) { .sheet { animation: none; } }
.sh-h { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid var(--red); padding-bottom: 8px; }
.sh-h h2 { margin: 0; font-size: 18px; }
.x { width: 32px; height: 32px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--card); font-size: 19px; line-height: 1; }
.field { display: flex; flex-direction: column; gap: 5px; border: 0; padding: 0; margin: 0; min-width: 0; }
.field > label, .field > .lab, .field > legend { font-size: 11.5px; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-soft); font-weight: 700; padding: 0; }
.field input[type="text"], .field textarea, .field select, .cfgrow input[type="text"], .cfgrow select { width: 100%; padding: 7px 9px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--card); }
.field textarea { resize: vertical; }
.seg { display: flex; flex-wrap: wrap; gap: 6px; }
.seg button { display: inline-flex; align-items: center; gap: 7px; padding: 5px 10px; border: 1px solid var(--line); border-radius: 999px; background: var(--card); font-size: 13px; }
.seg .sw { width: 10px; height: 10px; border-radius: 2px; background: var(--c, var(--line)); }
.seg button[aria-pressed="true"] { border-color: var(--ink); background: color-mix(in srgb, var(--c, var(--line)) 22%, var(--card)); box-shadow: 0 0 0 1px var(--ink); }
.elrow { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 4px 0; border-bottom: 1px solid var(--line); }
.tri { display: flex; gap: 4px; }
.tri button { padding: 3px 9px; font-size: 12px; border: 1px solid var(--line); border-radius: 999px; background: var(--card); }
.tri button[aria-pressed="true"] { border-color: var(--ink); box-shadow: 0 0 0 1px var(--ink); }
.tri .r[aria-pressed="true"] { background: color-mix(in srgb, var(--el-r) 25%, var(--card)); }
.tri .g[aria-pressed="true"] { background: color-mix(in srgb, var(--el-g) 25%, var(--card)); }
.newel { display: flex; gap: 6px; margin-top: 6px; }
.newel input { flex: 1; min-width: 0; padding: 6px 9px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--card); }
.chk-l { display: flex; align-items: center; gap: 9px; padding: 3px 0; cursor: pointer; }
.chk-l input { width: 17px; height: 17px; accent-color: var(--teal); flex: none; }
.chk-l small { color: var(--ink-soft); margin-left: auto; font-size: 11.5px; }
.archbox { border: 1px solid var(--line); background: var(--card); border-radius: var(--radius); padding: 10px; display: flex; flex-direction: column; gap: 8px; }
.archbox p { margin: 0; font-size: 13px; color: var(--ink-soft); }
.rowb { display: flex; flex-wrap: wrap; gap: 8px; }
.cfgrow { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 6px; align-items: center; margin-bottom: 6px; }
.cfgrow.el { grid-template-columns: minmax(0, 1fr) auto; }
.cfgrow.tp { grid-template-columns: auto auto minmax(0, 1fr) auto; }
.cpick { width: 34px; height: 32px; padding: 2px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--card); cursor: pointer; }
.cpick:disabled { opacity: .35; cursor: not-allowed; }
.cfgh { margin: 6px 0 4px; font-size: 14px; }
#toast { position: fixed; left: 50%; bottom: calc(16px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: var(--paper); padding: 9px 14px; border-radius: var(--radius); z-index: 60; max-width: calc(100% - 32px); font-size: 13px; }
</style>
</head>
<body>

<header id="topbar">
  <div class="tb-left">
    <span class="badge" aria-hidden="true">TD</span>
    <div><div class="brand">AGOA <span class="brand-accent">To do</span></div><div class="tb-sub">Rémi Thollet Architecte</div></div>
  </div>
  <div class="tb-right">
    <div class="week" aria-label="Numéro de semaine"><small>Semaine</small><b id="wk">–</b></div>
    <span class="tb-sep" aria-hidden="true"></span>
    <div class="today" id="dateLine">—</div>
    <button id="btnCfg" class="btn btn-ghost small" type="button">Réglages</button>
  </div>
</header>

<div class="wrap">
  <section class="toolbar" aria-label="Filtres">
    <label class="search"><span class="sr">Rechercher un dossier</span><input id="q" type="search" placeholder="Rechercher un dossier" autocomplete="off"></label>
    <div id="legend" class="legend" role="group" aria-label="Filtrer par type"></div>
    <button id="btnType" class="btn btn-outline small" type="button">+ Type</button>
  </section>
  <form id="typeForm" class="typeform" hidden>
    <label class="sr" for="tName">Nom du type</label>
    <input id="tName" type="text" placeholder="Nom du type, ex. Copropriété sensible" autocomplete="off">
    <div id="tSw" class="swatches" role="group" aria-label="Couleur"></div>
    <button class="btn btn-primary small" type="submit">Créer le type</button>
    <button class="btn btn-plain small" type="button" id="tCancel">Annuler</button>
  </form>

  <nav id="tabs" class="tabs" aria-label="Colonnes"></nav>
  <main id="board" class="board"></main>

  <footer class="foot">
    <span><b>Gras</b> : dessin préparé</span>
    <span><u>Souligné</u> : étude en cours</span>
    <span><i>Italique</i> : point à faire</span>
    <span>Pastilles rouge : élément manquant, verte : élément reçu. Un clic change la couleur.</span>
  </footer>
</div>

<div id="scrim" hidden></div>
<aside id="sheet" class="sheet" role="dialog" aria-modal="true" aria-label="Fiche dossier" hidden></aside>
<aside id="cfg" class="sheet" role="dialog" aria-modal="true" aria-label="Réglages" hidden></aside>
<div id="menu" role="menu" hidden></div>
<div id="dlgscrim" hidden></div>
<div id="dlg" role="alertdialog" aria-modal="true" aria-labelledby="dlgT" aria-describedby="dlgP" hidden></div>
<div id="toast" role="status" aria-live="polite" hidden></div>

<script src="shim.js"></script>
<script>
(function () {
  var $ = function (s) { return document.querySelector(s); };
  var esc = function (s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); };
  var norm = function (s) { return String(s || "").normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase(); };
  var LS = { get: function (k) { try { return localStorage.getItem(k); } catch (e) { return null; } }, set: function (k, v) { try { localStorage.setItem(k, v); } catch (e) {} } };
  var COLORS = [["red", "Rouge"], ["orange", "Orange"], ["violet", "Violet"], ["blue", "Bleu"], ["green", "Vert"], ["teal", "Turquoise"], ["gray", "Gris"], ["none", "Sans couleur (gras)"]];
  var COLL = ["tasks", "columns", "types", "elements", "lists"];
  var BILL = "__bill";
  var MAIL_TO = "comptabilite@remithollet.fr";

  var state = {
    d: { tasks: new Map(), columns: new Map(), types: new Map(), elements: new Map(), lists: new Map() },
    got: {}, error: null, db: null,
    filter: new Set(), q: "", person: LS.get("agoa.td.person") || "all",
    openId: null, adding: null, addingSep: null, editSep: null, colMenu: null, addCol: false,
    expanded: new Set(), archOpen: new Set(), armed: null, menu: null, sendStep: 0, newType: { color: "orange" }, typeOpen: false, dragId: null, seq: 0
  };
  var pending = new Map(), timers = new Map(), inflight = new Set(), armTimer = null, sendTimer = null, searchTimer = null;

  /* ---------- dates ---------- */
  var pad = function (n) { return String(n).padStart(2, "0"); };
  var ymd = function (d) { return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate()); };
  var today = function () { return ymd(new Date()); };
  var parseYmd = function (s) { var p = s.split("-").map(Number); return new Date(p[0], p[1] - 1, p[2]); };
  var monday = function (s) { var d = parseYmd(s); d.setDate(d.getDate() - ((d.getDay() + 6) % 7)); return ymd(d); };
  var shiftDays = function (s, n) { var d = parseYmd(s); d.setDate(d.getDate() + n); return ymd(d); };
  var fr = function (s) { var p = s.split("-"); return p[2] + "/" + p[1] + "/" + p[0]; };
  function isoWeek(d) {
    var t = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
    var day = t.getUTCDay() || 7; t.setUTCDate(t.getUTCDate() + 4 - day);
    var y0 = new Date(Date.UTC(t.getUTCFullYear(), 0, 1));
    return Math.ceil(((t - y0) / 864e5 + 1) / 7);
  }
  var weekOf = function (s) { return isoWeek(parseYmd(s)); };

  /* ---------- accès aux données ---------- */
  var arr = function (m) { return Array.from(m.values()); };
  var byOrder = function (a, b) { return (a.order || 0) - (b.order || 0) || (a.id < b.id ? -1 : 1); };
  var cols = function () { return arr(state.d.columns).sort(byOrder); };
  var types = function () { return arr(state.d.types).sort(byOrder); };
  var elements = function () { return arr(state.d.elements).sort(byOrder); };
  var colName = function (id) { var c = state.d.columns.get(id); return c ? c.name : "—"; };
  function itemsOf(cid) { return arr(state.d.tasks).filter(function (t) { return t.person === cid && !t.done; }).sort(byOrder); }
  /* catégories de facturation : ordre d'affichage dans « À facturer » ; « staged » = la fiche reste dans la colonne sous « … envoyé » */
  var BILL_CATS = [
    { k: "rv", label: "RV" }, { k: "rvtp", label: "RV TRAVAUX PRIVATIFS" },
    { k: "consult", label: "CONSULTATION ENTREPRISES", staged: true }, { k: "offres", label: "ANALYSE DES OFFRES", staged: true },
    { k: "dtg", label: "DTG" }, { k: "pc", label: "PC" }
  ];
  var MENU_ORDER = ["rv", "dtg", "rvtp", "consult", "offres", "pc"];
  var catOf = function (k) { for (var i = 0; i < BILL_CATS.length; i++) if (BILL_CATS[i].k === k) return BILL_CATS[i]; return null; };
  var catRank = function (k) { for (var i = 0; i < BILL_CATS.length; i++) if (BILL_CATS[i].k === k) return i; return -1; };
  function pendingBill() {
    return arr(state.d.tasks).filter(function (t) { return t.done && t.billing === "tobill" && !t.billed; })
      .sort(function (a, b) { return (catRank(a.billCat) - catRank(b.billCat)) || ((a.doneAt || "") < (b.doneAt || "") ? -1 : (a.doneAt || "") > (b.doneAt || "") ? 1 : 0); });
  }
  function archBtns(id, cls) {
    return MENU_ORDER.map(function (k) { return '<button class="' + cls + '" data-arch="' + esc(id) + '|' + k + '" role="menuitem">À facturer ' + esc(catOf(k).label) + '</button>'; }).join("");
  }
  var isSep = function (t) { return t.kind === "sep"; };
  function typesOf(t) {
    var a = Array.isArray(t.types) ? t.types : (t.status ? [t.status] : []);
    return types().filter(function (y) { return a.indexOf(y.id) >= 0; }).map(function (y) { return y.id; });
  }
  var HEX = /^#[0-9a-f]{6}$/i;
  var cssOf = function (c) { return HEX.test(c) ? c : "var(--c-" + c + ")"; };
  var hexOf = function (c) {
    if (HEX.test(c)) return c;
    try { var v = getComputedStyle(document.documentElement).getPropertyValue("--c-" + c).trim(); if (HEX.test(v)) return v; } catch (x) {}
    return "#888888";
  };
  var isBold = function (y) { return y && y.color === "none"; };
  var swHTML = function (y) { return isBold(y) ? '<span class="sw bold">B</span>' : '<span class="sw"></span>'; };
  var typeVar = function (id) { var t = state.d.types.get(id); return t ? cssOf(t.color) : ""; };
  function filtersOn() { return state.filter.size > 0 || !!state.q; }
  function visible(t) {
    if (isSep(t)) return !filtersOn();
    if (state.filter.size && !typesOf(t).some(function (k) { return state.filter.has(k); })) return false;
    if (state.q && norm((t.ref || "") + " " + (t.note || "")).indexOf(norm(state.q)) < 0) return false;
    return true;
  }
  var HIST_DAYS = 31; /* historique conservé et affiché : 1 mois */
  function doneWeeks(cid) {
    var m0 = monday(today()), m1 = shiftDays(m0, -7), cut = shiftDays(today(), -HIST_DAYS), map = {};
    arr(state.d.tasks).forEach(function (t) {
      if (t.person !== cid || !t.done || !t.doneAt || isSep(t) || t.copyOf || t.doneAt < cut) return;
      (map[monday(t.doneAt)] = map[monday(t.doneAt)] || []).push(t);
    });
    map[m0] = map[m0] || [];
    var srt = function (a, b) { return a.doneAt < b.doneAt ? 1 : a.doneAt > b.doneAt ? -1 : 0; };
    return Object.keys(map).sort().reverse().map(function (m) {
      return { n: weekOf(m), items: map[m].sort(srt), label: m === m0 ? " · en cours" : m === m1 ? " · précédente" : "", cur: m === m0 };
    });
  }

  /* ---------- écriture ---------- */
  function toast(msg) { var t = $("#toast"); t.textContent = msg; t.hidden = false; clearTimeout(toast.t); toast.t = setTimeout(function () { t.hidden = true; }, 4200); }
  function writeError(e) { toast("L’enregistrement a échoué" + (e && e.message ? " — " + e.message : ". Réessayez dans un instant.")); }
  function flush(key) {
    if (inflight.has(key) || !pending.has(key) || !state.db) return;
    var p = pending.get(key), parts = key.split("/");
    pending.delete(key); inflight.add(key);
    state.db.collection(parts[0]).doc(parts[1]).update(p).catch(writeError).then(function () { inflight.delete(key); if (pending.has(key)) flush(key); });
  }
  function queue(coll, id, patch, delay) {
    var key = coll + "/" + id;
    pending.set(key, Object.assign(pending.get(key) || {}, patch));
    clearTimeout(timers.get(key));
    if (delay) timers.set(key, setTimeout(function () { flush(key); }, delay)); else flush(key);
  }
  function edit(coll, id, patch, delay) {
    var cur = state.d[coll].get(id); if (!cur) return;
    state.d[coll].set(id, Object.assign({}, cur, patch));
    renderAll(); queue(coll, id, patch, delay || 0);
  }
  function create(coll, data) {
    var id = (coll === "tasks" ? "t" : coll === "columns" ? "c" : coll === "types" ? "y" : coll === "elements" ? "e" : "l") + Date.now().toString(36) + Math.random().toString(36).slice(2, 5);
    state.d[coll].set(id, Object.assign({ id: id }, data));
    if (state.db) state.db.collection(coll).doc(id).set(data).catch(function (e) { state.d[coll].delete(id); renderAll(); writeError(e); });
    return id;
  }
  function removeDoc(coll, id) {
    state.d[coll].delete(id); pending.delete(coll + "/" + id); clearTimeout(timers.get(coll + "/" + id));
    if (state.db) state.db.collection(coll).doc(id).delete().catch(writeError);
  }
  function nextOrder(cid) { var m = 0; state.d.tasks.forEach(function (t) { if (t.person === cid && typeof t.order === "number") m = Math.max(m, t.order); }); return m + 1; }
  function createTask(cid, data) { return create("tasks", Object.assign({ person: cid, order: nextOrder(cid) }, data)); }

  /* ---------- confirmations en deux temps ---------- */
  function arm(key) { state.armed = key; clearTimeout(armTimer); armTimer = setTimeout(function () { state.armed = null; rerender(); }, 4000); rerender(); }
  function disarm() { state.armed = null; clearTimeout(armTimer); }
  var isArmed = function (k) { return state.armed === k; };
  function rerender() { renderBoard(); if (!$("#sheet").hidden) fillSheet(); if (!$("#cfg").hidden) fillCfg(); }

  /* ---------- rendu : entête, filtres, onglets ---------- */
  function renderHead() {
    var now = new Date();
    $("#wk").textContent = isoWeek(now);
    $("#dateLine").textContent = new Intl.DateTimeFormat("fr-FR", { weekday: "long", day: "numeric", month: "long", year: "numeric" }).format(now);
  }
  function renderLegend() {
    var c = {};
    state.d.tasks.forEach(function (t) { if (!t.done && !isSep(t)) typesOf(t).forEach(function (k) { c[k] = (c[k] || 0) + 1; }); });
    var h = types().map(function (t) {
      return '<button class="chip" style="--c:' + (isBold(t) ? "var(--ink-soft)" : cssOf(t.color)) + '" data-type="' + esc(t.id) + '" aria-pressed="' + state.filter.has(t.id) + '">' + swHTML(t) + esc(t.name) + ' <i>' + (c[t.id] || 0) + '</i></button>';
    }).join("");
    if (state.filter.size) h += '<button class="chip clear" data-type="__clear">Tout afficher</button>';
    $("#legend").innerHTML = h;
  }
  function renderTabs() {
    var cnt = {};
    state.d.tasks.forEach(function (t) { if (!t.done && !isSep(t)) cnt[t.person] = (cnt[t.person] || 0) + 1; });
    var total = 0; Object.keys(cnt).forEach(function (k) { total += cnt[k]; });
    var oldIn = $("#colName"), oldVal = oldIn ? oldIn.value : "", hadFocus = !!oldIn && document.activeElement === oldIn;
    var h = '<button data-person="all" aria-pressed="' + (state.person === "all") + '">Tous<i>' + total + '</i></button>';
    h += cols().map(function (c) { return '<button data-person="' + esc(c.id) + '" aria-pressed="' + (state.person === c.id) + '">' + esc(c.name) + '<i>' + (cnt[c.id] || 0) + '</i></button>'; }).join("");
    h += '<button data-person="' + BILL + '" aria-pressed="' + (state.person === BILL) + '">À facturer<i>' + pendingBill().length + '</i></button>';
    if (state.addCol) h += '<form id="colForm"><label class="sr" for="colName">Nom de la colonne</label><input id="colName" type="text" placeholder="Nom de la colonne" autocomplete="off"><button class="btn btn-primary small" type="submit">Créer</button><button class="btn btn-plain small" type="button" data-colcancel="1">Annuler</button></form>';
    else h += '<button class="add" data-addcol="1">+ Colonne</button>';
    $("#tabs").innerHTML = h;
    if (state.addCol) { var ci = $("#colName"); if (ci) { ci.value = oldVal; if (hadFocus) ci.focus(); } }
  }

  /* ---------- rendu : lignes ---------- */
  function pillsHTML(t) {
    var els = t.els || {};
    return elements().filter(function (e) { return els[e.id]; }).map(function (e) {
      var v = els[e.id] === "g" ? "g" : "r", lab = e.name + " : " + (v === "g" ? "reçu" : "manquant");
      return '<button class="pill ' + v + '" data-el="' + esc(t.id) + '|' + esc(e.id) + '" title="' + esc(lab) + ' (cliquer pour changer)" aria-label="' + esc(lab) + '. Cliquer pour changer."><span class="dot"></span>' + esc(e.name) + '</button>';
    }).join("");
  }
  var CHECK = '<svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 6.5l2.6 2.6L10 3.5"/></svg>';
  function taskHTML(t) {
    var ks = typesOf(t), bold = !!t.drawn, style = "";
    ks.forEach(function (k) { if (isBold(state.d.types.get(k))) bold = true; });
    var ck = ks.filter(function (k) { return !isBold(state.d.types.get(k)); }), n = ck.length;
    var cs = ck.map(function (k) { return cssOf(state.d.types.get(k).color); });
    if (n) {
      var seg = cs.map(function (c, i) { return c + " " + (i * 100 / n) + "% " + ((i + 1) * 100 / n) + "%"; }).join(",");
      var tint = cs.map(function (c) { return "color-mix(in srgb," + c + " " + (n > 1 ? 20 : 14) + "%,var(--card))"; });
      /* plusieurs types : bandes de biais, bords nets, côte à côte (pas de dégradé) */
      var bands = tint.map(function (c, i) { return c + " " + (i * 100 / n) + "% " + ((i + 1) * 100 / n) + "%"; }).join(",");
      style = "--c:" + cs[0] + ";--stripe:linear-gradient(to bottom," + seg + ");--tint:" + (n > 1 ? "linear-gradient(105deg," + bands + ")" : tint[0]) + ";";
    }
    var cls = "task" + (n ? " typed" : "") + (bold ? " b" : "") + (t.study ? " u" : "") + (t.todo ? " i" : "");
    return '<li class="' + cls + '" style="' + style + '" draggable="true" data-id="' + esc(t.id) + '">' + (n ? '<span class="stripe" aria-hidden="true"></span>' : "") +
      '<button class="chk" role="checkbox" aria-checked="false" data-chk="' + esc(t.id) + '" aria-label="Terminer : ' + esc(t.ref) + '">' + CHECK + '</button>' +
      '<div class="tbody"><button class="open" data-open="' + esc(t.id) + '" style="width:100%"><span class="line1"><span class="ref">' + esc(t.ref) + '</span></span>' +
      (t.note ? '<span class="note">' + esc(t.note) + '</span>' : '') + (ks.length ? '<span class="sr">Types : ' + esc(ks.map(function (k) { return state.d.types.get(k).name; }).join(", ")) + '</span>' : '') + '</button>' +
      (t.els && Object.keys(t.els).some(function (k) { return t.els[k] && state.d.elements.has(k); }) ? '<div class="line1" style="padding:0 8px 7px 4px">' + pillsHTML(t) + '</div>' : '') + '</div></li>';
  }
  function sepHTML(t) {
    if (state.editSep === t.id) return '<li class="sep" data-id="' + esc(t.id) + '"><form class="sepedit" data-sid="' + esc(t.id) + '"><input type="text" aria-label="Nom du séparateur" value="' + esc(t.label) + '"></form></li>';
    return '<li class="sep" draggable="true" data-id="' + esc(t.id) + '"><button class="lbl" data-sepedit="' + esc(t.id) + '" title="Cliquer pour renommer">' + esc(t.label || "Séparateur") + '</button><span class="rule"></span><button class="x" data-sepdel="' + esc(t.id) + '" aria-label="Supprimer le séparateur ' + esc(t.label) + '">×</button></li>';
  }
  function doneHTML(t, showCol) {
    var tags = '<span class="tag">terminé le ' + esc(fr(t.doneAt)) + '</span>';
    if (t.billing === "tobill") {
      var L = t.billed ? state.d.lists.get(t.billed) : null;
      var cc = catOf(t.billCat), cl = cc ? ' · ' + esc(cc.label) : '';
      tags += L ? ' <span class="tag bill">Facturé · liste n°' + esc(L.n) + cl + '</span>' : ' <span class="tag bill">À facturer' + cl + '</span>';
    }
    return '<li class="task done" data-id="' + esc(t.id) + '"><button class="chk" role="checkbox" aria-checked="true" data-unchk="' + esc(t.id) + '" aria-label="Remettre en cours : ' + esc(t.ref) + '">' + CHECK + '</button>' +
      '<button class="open" data-open="' + esc(t.id) + '"><span class="line1"><span class="ref">' + esc(t.ref) + '</span></span>' + (t.note ? '<span class="note">' + esc(t.note) + '</span>' : '') + '<span class="line1">' + tags + '</span></button></li>';
  }

  /* ---------- rendu : colonnes ---------- */
  function sugHTML() {
    var a = state.adding; if (!a) return "";
    var q = a.v.trim(), h = "";
    if (q.length < 2) return "";
    if (a.status === "loading") return '<li class="sug-msg">Recherche dans Ragic…</li>';
    var taken = {}; state.d.tasks.forEach(function (t) { if (!t.done && !isSep(t)) taken[norm(t.ref)] = colName(t.person); });
    if (a.status === "done" && a.results.length) {
      a.results.forEach(function (r, i) {
        var dup = taken[norm(r.code)];
        h += '<li><button type="button" class="sug-it' + (i === a.idx ? " on" : "") + '" data-pick="' + i + '"><span class="c">' + esc(r.code) + (dup ? ' <span class="tag">déjà dans ' + esc(dup) + '</span>' : '') + '</span><span class="o">' + esc([r.objet, r.syndic].filter(Boolean).join(" · ")) + '</span></button></li>';
      });
      h += '<li><button type="button" class="sug-manual alt" data-manual="1">Autre référence : saisie manuelle de « ' + esc(q) + ' »</button></li>';
      return h;
    }
    if (a.status === "done") h += '<li class="sug-msg">Aucune référence Ragic ne correspond à « ' + esc(q) + ' ».</li>';

    else return "";

    e.preventDefault();
    var v = $("#tName").value.trim(); if (!v) return;
    create("types", { name: v, color: state.newType.color, order: (types().length ? types()[types().length - 1].order || 0 : 0) + 1 });
    $("#tName").value = ""; state.typeOpen = false; $("#typeForm").hidden = true; renderAll(); toast("Type « " + v + " » créé.");
  });

  /* ---------- démarrage ---------- */
  renderAll();
  function applySnap(coll, snap) {
    var m = new Map();
    snap.docs.forEach(function (d) { m.set(d.id, Object.assign({ id: d.id }, d.data())); });
    pending.forEach(function (patch, key) { var p = key.split("/"); if (p[0] === coll && m.has(p[1])) m.set(p[1], Object.assign({}, m.get(p[1]), patch)); });
    state.d[coll] = m; state.got[coll] = true; state.error = null;
    if (state.openId && !m.has(state.openId) && coll === "tasks") closeAll();
    renderHead(); renderLegend(); renderTabs();
    var ae = document.activeElement;
    if (ae && ae.closest && ae.closest("#board") && (ae.tagName === "INPUT") && !ae.classList.contains("addinput")) { return; }
    renderBoard();
  }
  if (window.claude && window.claude.use) {
    window.claude.use("db").then(function (db) {
      if (!db) { state.error = "base indisponible"; renderAll(); return; }
      state.db = db;
      COLL.forEach(function (c) { db.collection(c).onSnapshot(function (s) { applySnap(c, s); }, function (err) { state.error = (err && err.code) || "erreur"; renderAll(); }); });
    }).catch(function () { state.error = "base indisponible"; renderAll(); });
  } else { state.error = "base indisponible"; renderAll(); }
})();
</script>
<script src="account.js"></script>
</body>
