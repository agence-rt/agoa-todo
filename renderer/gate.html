<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline'; img-src 'self' data:">
<title>AGOA TD</title>
<style>
:root { --red:#A31621; --red-dark:#7d1119; --teal:#2F6F72; --teal-dark:#234f52; --ink:#232323; --ink-soft:#5b5b5b; --paper:#FAF9F6; --card:#fff; --line:#e3e0d8; --radius:6px; }
@media (prefers-color-scheme: dark) { :root { --ink:#ece9e2; --ink-soft:#a9a59c; --paper:#161616; --card:#1f1f1f; --line:#343434; --red:#C4262F; } }
* { box-sizing:border-box; }
body { margin:0; min-height:100vh; display:flex; flex-direction:column; background:var(--paper); color:var(--ink); font-family:"Segoe UI",system-ui,sans-serif; font-size:15px; }
header { background:var(--red); color:#fff; padding:14px 20px; display:flex; align-items:center; gap:12px; }
.badge { background:#fff; color:var(--red); font-weight:800; border-radius:4px; padding:2px 7px; letter-spacing:.02em; }
.brand { font-weight:700; font-size:18px; } .brand span { font-weight:400; opacity:.9; }
main { flex:1; display:grid; place-items:center; padding:24px 16px; }
.card { width:min(460px,100%); background:var(--card); border:1px solid var(--line); border-top:4px solid var(--red); border-radius:var(--radius); padding:26px 28px; box-shadow:0 2px 14px rgba(0,0,0,.07); }
h1 { margin:0 0 6px; font-size:20px; } p { margin:0 0 16px; color:var(--ink-soft); line-height:1.45; }
.steps { display:flex; gap:8px; margin:0 0 18px; padding:0; list-style:none; font-size:12.5px; color:var(--ink-soft); }
.steps li { flex:1; padding-top:6px; border-top:3px solid var(--line); } .steps li.on { border-color:var(--teal); color:var(--ink); font-weight:600; } .steps li.done { border-color:var(--teal); }
button.primary { width:100%; padding:11px 14px; border:1px solid var(--teal); background:var(--teal); color:#fff; border-radius:var(--radius); font:inherit; font-weight:600; cursor:pointer; }
button.primary:hover { background:var(--teal-dark); } button:disabled { opacity:.6; cursor:wait; }
button.link { background:none; border:0; padding:0; color:var(--teal); font:inherit; text-decoration:underline; cursor:pointer; margin-top:12px; }
input { width:100%; padding:10px; border:1px solid var(--line); border-radius:var(--radius); background:var(--card); color:var(--ink); font:inherit; margin-bottom:12px; }
label { display:block; font-size:13px; font-weight:600; margin-bottom:5px; }
.err { background:#fdeceb; color:#7d1119; border:1px solid #f0b4b0; border-radius:var(--radius); padding:10px 12px; margin:0 0 14px; font-size:14px; }
@media (prefers-color-scheme: dark) { .err { background:#3a1d20; color:#f3b9b6; border-color:#6b2a2e; } }
small { color:var(--ink-soft); }
</style>
</head>
<body>
<header><span class="badge" aria-hidden="true">TD</span><div class="brand">AGOA <span>To do</span></div></header>
<main><div class="card" id="card" aria-live="polite"><p>Chargement…</p></div></main>
<script src="gate.js"></script>
</body>
</html>
