name: Construire AGOA TD (Windows)

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      publier:
        description: "Publier une release avec la version de package.json (v + version)"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  tests:
    runs-on: ubuntu-latest
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test

  windows:
    needs: tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Identifiants Google (secrets du dépôt)
        shell: pwsh
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: |
          if (-not $env:GOOGLE_CLIENT_ID -or -not $env:GOOGLE_CLIENT_SECRET) {
            Write-Warning "Secrets GOOGLE_CLIENT_ID / GOOGLE_CLIENT_SECRET absents : l'installateur sera construit SANS connexion Google."
          } else {
            @{ clientId = $env:GOOGLE_CLIENT_ID; clientSecret = $env:GOOGLE_CLIENT_SECRET } | ConvertTo-Json | Set-Content -Encoding utf8 resources/google-client.json
          }

      - run: npm run dist

      - uses: actions/upload-artifact@v4
        with:
          name: AGOA-TD-installateur
          path: dist/*.exe
          if-no-files-found: error

      - name: Lire la version
        id: ver
        shell: pwsh
        run: "'v=' + (Get-Content package.json -Raw | ConvertFrom-Json).version | Out-File -Append -Encoding utf8 $env:GITHUB_OUTPUT"

      - name: Publier dans les Releases (étiquette v*)
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.publier)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('v{0}', steps.ver.outputs.v) }}
          target_commitish: ${{ github.sha }}
          files: |
            dist/*.exe
            dist/latest.yml
            dist/*.exe.blockmap
